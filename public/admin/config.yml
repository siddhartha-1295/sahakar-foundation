backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/sahakar-foundation   # change this
  branch: main
  base_url: https://api.netlify.com               # lets Netlify handle GitHub login
  auth_endpoint: auth

local_backend: true        # run "npx decap-server" next to "npm run dev" to edit locally
media_folder: public/uploads
public_folder: /uploads
site_url: https://YOUR-SITE.netlify.app

collections:
  - name: updates
    label: Activities
    folder: src/content/updates
    extension: md
    create: true
    slug: "{{slug}}"
    summary: "{{date}} – {{title}}"
    fields:
      - { label: Title (English), name: title, widget: string }
      - { label: Title (Telugu), name: title_te, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - label: Area of work
        name: pillar
        widget: select
        options:
          - { label: Education, value: education }
          - { label: Basic Necessities, value: necessities }
          - { label: Cleanliness, value: cleanliness }
          - { label: Health & Medicine, value: medicine }
          - { label: Social Awareness, value: awareness }
          - { label: Dharma, value: dharma }
      - { label: Short summary (English), name: summary, widget: text }
      - { label: Short summary (Telugu), name: summary_te, widget: text, required: false }
      - { label: Cover photo, name: cover, widget: image, required: false }
      - { label: Photos, name: photos, widget: list, required: false, field: { label: Photo, name: photo, widget: image } }
      - { label: YouTube link, name: youtube, widget: string, required: false }
      - { label: Place, name: location, widget: string, required: false }
      - { label: Full story (Telugu), name: body_te, widget: markdown, required: false }
      - { label: Full story (English), name: body, widget: markdown }

  - name: events
    label: Events
    folder: src/content/events
    extension: md
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title (English), name: title, widget: string }
      - { label: Title (Telugu), name: title_te, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Time (e.g. 9:00 AM), name: time, widget: string, required: false }
      - { label: Place, name: location, widget: string, required: false }
      - label: Area of work
        name: pillar
        widget: select
        required: false
        options:
          - { label: Education, value: education }
          - { label: Basic Necessities, value: necessities }
          - { label: Cleanliness, value: cleanliness }
          - { label: Health & Medicine, value: medicine }
          - { label: Social Awareness, value: awareness }
          - { label: Dharma, value: dharma }
      - { label: Description (English), name: description, widget: text, required: false }
      - { label: Description (Telugu), name: description_te, widget: text, required: false }
      - { label: Cover photo, name: cover, widget: image, required: false }
      - { label: Registration link, name: register_link, widget: string, required: false }

  - name: albums
    label: Gallery albums
    folder: src/content/albums
    extension: md
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title (English), name: title, widget: string }
      - { label: Title (Telugu), name: title_te, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Description (English), name: description, widget: text, required: false }
      - { label: Description (Telugu), name: description_te, widget: text, required: false }
      - { label: Cover photo, name: cover, widget: image, required: false }
      - { label: Photos (add at least one), name: photos, widget: list, min: 1, field: { label: Photo, name: photo, widget: image } }

  - name: legal
    label: Policy pages
    folder: src/content/legal
    extension: md
    create: false
    delete: false
    fields:
      - { label: Title (English), name: title, widget: string }
      - { label: Title (Telugu), name: title_te, widget: string, required: false }
      - { label: Last updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Text (Telugu), name: body_te, widget: markdown, required: false }
      - { label: Text (English), name: body, widget: markdown }

  - name: site
    label: Site settings
    files:
      - label: General settings
        name: settings
        file: src/data/settings.json
        fields:
          - { label: Name (English), name: name, widget: string }
          - { label: Name (Telugu), name: name_te, widget: string }
          - { label: Tagline (English), name: tagline, widget: string }
          - { label: Tagline (Telugu), name: tagline_te, widget: string }
          - { label: Home title (English), name: hero_title, widget: string }
          - { label: Home title (Telugu), name: hero_title_te, widget: string }
          - { label: Home intro (English), name: hero_text, widget: text }
          - { label: Home intro (Telugu), name: hero_text_te, widget: text }
          - { label: Mission (English), name: mission, widget: text }
          - { label: Mission (Telugu), name: mission_te, widget: text }
          - { label: Vision (English), name: vision, widget: text }
          - { label: Vision (Telugu), name: vision_te, widget: text }
          - { label: Story (English), name: story, widget: text }
          - { label: Story (Telugu), name: story_te, widget: text }
          - { label: Phone, name: phone, widget: string }
          - { label: "WhatsApp number (country code, no + or spaces, e.g. 919876543210)", name: whatsapp, widget: string }
          - { label: WhatsApp group invite link, name: whatsapp_group, widget: string, required: false }
          - { label: Email, name: email, widget: string }
          - { label: Address (English), name: address, widget: string }
          - { label: Address (Telugu), name: address_te, widget: string }
          - { label: "Website address (https://...)", name: site_url, widget: string }
          - label: Social links
            name: social
            widget: object
            fields:
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
              - { label: X (Twitter), name: x, widget: string, required: false }
          - label: Impact numbers
            name: impact
            widget: list
            fields:
              - { label: Number, name: value, widget: string }
              - { label: Label (English), name: label, widget: string }
              - { label: Label (Telugu), name: label_te, widget: string }
          - label: Team
            name: team
            widget: list
            fields:
              - { label: Name (English), name: name, widget: string }
              - { label: Name (Telugu), name: name_te, widget: string, required: false }
              - { label: Role (English), name: role, widget: string }
              - { label: Role (Telugu), name: role_te, widget: string, required: false }
              - { label: Photo, name: photo, widget: image, required: false }
          - { label: Cloudflare Web Analytics token (optional), name: analytics_token, widget: string, required: false }
      - label: Donate page
        name: donate
        file: src/data/donate.json
        fields:
          - { label: Intro text (optional), name: intro, widget: text, required: false }
          - { label: Suggested amounts (₹), name: amounts, widget: list, field: { label: Amount, name: amount, widget: number, value_type: int } }
          - { label: UPI ID (leave empty to show a sample QR), name: upi_id, widget: string, required: false }
          - { label: Name shown in UPI apps, name: upi_name, widget: string }
          - { label: Razorpay Payment Button ID (optional), name: razorpay_button_id, widget: string, required: false }
          - { label: "Ask for PAN on receipt form (80G)", name: show_80g, widget: boolean, default: false }
          - label: Bank details
            name: bank
            widget: object
            fields:
              - { label: Account name, name: account_name, widget: string }
              - { label: Account number, name: account_number, widget: string }
              - { label: IFSC, name: ifsc, widget: string }
              - { label: Bank, name: bank, widget: string }
              - { label: Branch, name: branch, widget: string }
      - label: Transparency page
        name: transparency
        file: src/data/transparency.json
        fields:
          - label: Registration details
            name: registration
            widget: list
            fields:
              - { label: Label (English), name: label, widget: string }
              - { label: Label (Telugu), name: label_te, widget: string, required: false }
              - { label: Value, name: value, widget: string }
          - label: Fund use (percentages)
            name: fund_use
            widget: list
            fields:
              - { label: Label (English), name: label, widget: string }
              - { label: Label (Telugu), name: label_te, widget: string, required: false }
              - { label: Percent, name: percent, widget: number, value_type: int, min: 0, max: 100 }
          - label: Commitments
            name: commitments
            widget: list
            fields:
              - { label: Text (English), name: text, widget: string }
              - { label: Text (Telugu), name: text_te, widget: string, required: false }
          - label: Certificates
            name: certificates
            widget: list
            required: false
            fields:
              - { label: Title (English), name: title, widget: string }
              - { label: Title (Telugu), name: title_te, widget: string, required: false }
              - { label: PDF file, name: file, widget: file }
